spring.application.name=API-GATEWAY
server.port=9191
# eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
management.endpoints.web.exposure.include=*
#
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true
#logging.level.org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping=DEBUG

# Routes for Employee Service
spring.cloud.gateway.server.webmvc.routes[0].id=EMPLOYEE-SVC
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://EMPLOYEE-SVC
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/employees/**

## Routes for Department Service
spring.cloud.gateway.server.webmvc.routes[1].id=DEPARTMENT-SVC
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://DEPARTMENT-SVC
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/departments/**

## Routes for Organization Service
spring.cloud.gateway.server.webmvc.routes[2].id=ORGANIZATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ORGANIZATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/organizations/**

spring.cloud.gateway.server.webmvc.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webmvc.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE


