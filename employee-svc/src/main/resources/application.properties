spring.config.import=optional:configserver:http://localhost:8888

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#Actuator for circuit breaker
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Circuit Breaker configuration
resilience4j.circuitbreaker.instances.employee-svc.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.employee-svc.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employee-svc.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.employee-svc.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.employee-svc.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.employee-svc.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.employee-svc.slidingWindowSize=10
resilience4j.circuitbreaker.instances.employee-svc.slidingWindowType=COUNT_BASED
