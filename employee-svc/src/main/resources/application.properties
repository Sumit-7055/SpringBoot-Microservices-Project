spring.application.name=employee-svc
##Configure SQL database
#spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:employee_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sumit@SQL}
#
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.ddl-auto=update
#
server.port=8081
#eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
# spring.config.import=optional:configserver:http://localhost:8888
spring.config.import=optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
# spring.rabbitmq.host=localhost
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.boot.message=Hello, Employee Service - this is used to test cloud bus test

#Actuator for circuit breaker
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Circuit Breaker configuration
resilience4j.circuitbreaker.instances.employee-svc.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.employee-svc.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employee-svc.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.employee-svc.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.employee-svc.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.employee-svc.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.employee-svc.slidingWindowSize=10
resilience4j.circuitbreaker.instances.employee-svc.slidingWindowType=COUNT_BASED
